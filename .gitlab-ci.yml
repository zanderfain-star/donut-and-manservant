# GitLab Pages — free static hosting for the Vite build.
# GitLab serves whatever lands in `public/` from the `pages` job.
image: node:20

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
